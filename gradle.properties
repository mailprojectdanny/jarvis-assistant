# Required: AGP refuses to build a project that depends on AndroidX libraries
# (this one does, throughout) unless this is explicitly enabled.
android.useAndroidX=true

# Recommended default for AGP 8.x projects; keeps generated R classes scoped per
# module instead of one flat namespace. Not strictly required but avoids a
# migration warning and matches what `gradle init`/Android Studio generate today.
android.nonTransitiveRClass=true

# Compose + AGP 8.5 compilation can need more heap than the Gradle daemon's
# default; 2g is a safe, modest bump rather than an arbitrary large number.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enables the Gradle daemon and parallel project execution for faster local
# builds. Standard defaults for a single-module app like this one.
org.gradle.daemon=true
org.gradle.parallel=true

# Kotlin/AGP: use the Kotlin-preferred coding style for any generated code.
kotlin.code.style=official
